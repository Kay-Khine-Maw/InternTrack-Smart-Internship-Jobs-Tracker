services:
  postgres:
    image: postgres:16-alpine
    container_name: interntrack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: interntrack
      POSTGRES_PASSWORD: interntrack
      POSTGRES_DB: interntrack
    volumes:
      - interntrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interntrack -d interntrack"]
      interval: 3s
      timeout: 5s
      retries: 10

volumes:
  interntrack_pgdata:
